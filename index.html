<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dominance Video Task</title>

  <!-- jsPsych v8 -->
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>

  <!-- DataPipe plugin for OSF saving -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.6.0"></script>

  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet" type="text/css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body.hide-cursor,
    body.hide-cursor * {
      cursor: none !important;
    }

    .jspsych-content-wrapper {
      width: 100vw;
      height: 100vh;
    }

    .jspsych-content {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
    }

    .message-box {
      max-width: 850px;
      margin: auto;
      font-size: 22px;
      line-height: 1.5;
      text-align: center;
      color: white;
    }

    .jspsych-btn {
      font-size: 22px;
      padding: 14px 34px;
      border-radius: 10px;
      cursor: pointer;
    }

    /*
      =========================================================
      FULLSCREEN IMAGE INSTRUCTION PAGES
      =========================================================
    */

    body.instruction-screen .jspsych-content-wrapper,
    body.instruction-screen .jspsych-content {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      margin: 0;
      padding: 0;
    }

    .fullscreen-instruction-page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      overflow: hidden;
      z-index: 1;
    }

    .fullscreen-instruction-image {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #111;
    }

    body.instruction-screen #jspsych-html-button-response-btngroup {
      position: fixed;
      left: 32px;
      bottom: 32px;
      z-index: 1000;
      margin: 0 !important;
      padding: 0 !important;
      text-align: left;
    }

    body.instruction-screen .jspsych-btn {
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      border: 2px solid #111;
      font-size: 22px;
      font-weight: bold;
      padding: 14px 34px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    /*
      =========================================================
      CODE PAGE
      =========================================================
    */

    body.code-screen .jspsych-content-wrapper,
    body.code-screen .jspsych-content {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      margin: 0;
      padding: 0;
    }

    body.code-screen #jspsych-survey-text-form {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-size: 24px;
      line-height: 1.5;
      text-align: center;
    }

    body.code-screen #jspsych-survey-text-form input[type="text"] {
      font-size: 24px;
      padding: 12px 16px;
      width: 420px;
      max-width: 80vw;
      border-radius: 8px;
      border: 2px solid white;
      margin-top: 20px;
      text-align: center;
    }

    body.code-screen .jspsych-survey-text-question {
      margin: 24px 0;
    }

    /*
      =========================================================
      DOMINANCE VIDEO TASK
      =========================================================
    */

    #dominance-task {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 30px;
      align-items: center;
      box-sizing: border-box;
      padding: 30px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #video-panel {
      position: relative;
      width: 100%;
      height: 88vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #stim-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #play-button {
      position: absolute;
      z-index: 10;
      padding: 18px 36px;
      font-size: 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    #scale-panel {
      height: 88vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #scale-title {
      font-size: 24px;
      margin-bottom: 24px;
      font-weight: bold;
    }

    #scale-container {
      position: relative;
      width: 120px;
      height: 68vh;
    }

    #scale-axis {
      position: absolute;
      left: 58px;
      top: 0;
      width: 4px;
      height: 100%;
      background: #777;
      border-radius: 4px;
    }

    #positive-fill,
    #negative-fill {
      position: absolute;
      left: 58px;
      width: 4px;
      border-radius: 4px;
    }

    #positive-fill {
      background: #3fa7ff;
      bottom: 50%;
      height: 0%;
    }

    #negative-fill {
      background: #ff8c42;
      top: 50%;
      height: 0%;
    }

    #zero-tick {
      position: absolute;
      left: 42px;
      top: 50%;
      width: 36px;
      height: 3px;
      background: white;
      transform: translateY(-50%);
    }

    .major-tick {
      position: absolute;
      left: 48px;
      width: 24px;
      height: 2px;
      background: white;
      transform: translateY(-50%);
    }

    #tick-plus {
      top: 0%;
    }

    #tick-minus {
      top: 100%;
    }

    .scale-label {
      position: absolute;
      left: 82px;
      transform: translateY(-50%);
      font-size: 16px;
      white-space: nowrap;
    }

    #label-plus {
      top: 0%;
    }

    #label-zero {
      top: 50%;
    }

    #label-minus {
      top: 100%;
    }

    #dominance-handle {
      position: absolute;
      left: 45px;
      top: calc(50% - 15px);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      border: 3px solid #222;
      box-sizing: border-box;
      transition: top 80ms linear, background 80ms linear;
    }

    #current-value {
      margin-top: 26px;
      font-size: 26px;
      font-weight: bold;
    }

    #instructions {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.35;
      color: #ddd;
      text-align: center;
      max-width: 240px;
    }
  </style>
</head>

<body></body>

<script>
  /*
    =========================================================
    SETTINGS TO CHANGE
    =========================================================
  */

  const EXPERIMENT_ID = "vFDGzbs3JJ9N";

  const VIDEO_PART1_FILE = "https://www.sane-elab.eu/pecan/TheFather_run2_part1_wcross.mp4";
  const VIDEO_PART2_FILE = "https://www.sane-elab.eu/pecan/TheFather_run2_part2_wcross.mp4";

  const INSTRUCTION_IMAGES = [
    "stimuli/instructions_1.png",
    "stimuli/instructions_2.png",
    "stimuli/instructions_3.png"
  ];

  const DEBUG_MODE = false;

  /*
    This flag is used if the participant interrupts the experiment
    with ESC or by exiting fullscreen. If part 1 is interrupted,
    part 2 will be skipped, but the data collected up to that point
    will still be saved.
  */
  let experimentInterrupted = false;

  /*
    =========================================================
    INITIALIZE JSPSYCH
    =========================================================
  */

  const jsPsych = initJsPsych({
    on_finish: function() {
      document.body.classList.remove("hide-cursor");
      document.body.classList.remove("instruction-screen");
      document.body.classList.remove("code-screen");

      if (DEBUG_MODE) {
        jsPsych.data.displayData("json");
      }
    }
  });

  /*
    =========================================================
    PARTICIPANT AND FILE NAMING
    =========================================================
  */

  function getURLParameter(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function sanitizeForFilename(value) {
    return String(value)
      .replace(/[^a-zA-Z0-9_-]/g, "_")
      .substring(0, 80);
  }

  const participantID =
    getURLParameter("PROLIFIC_PID") ||
    getURLParameter("participant") ||
    getURLParameter("participant_id") ||
    jsPsych.randomization.randomID(12);

  const sessionID = jsPsych.randomization.randomID(12);

  const timestamp = new Date()
    .toISOString()
    .replace(/[:.]/g, "-");

  const filenameBase =
    sanitizeForFilename(participantID) + "_" +
    sanitizeForFilename(sessionID) + "_" +
    timestamp;

  /*
    Two different filenames are needed because DataPipe/OSF cannot
    overwrite a file with the same name.

    The first file is saved immediately after part 1.
    The second file is saved after part 2 and contains the complete dataset.
  */
  const dataFilenamePart1 = "dominance_part1_" + filenameBase + ".csv";
  const dataFilenameComplete = "dominance_complete_" + filenameBase + ".csv";

  jsPsych.data.addProperties({
    participant_id: participantID,
    session_id: sessionID,
    video_part1_file: VIDEO_PART1_FILE,
    video_part2_file: VIDEO_PART2_FILE,
    data_filename_part1: dataFilenamePart1,
    data_filename_complete: dataFilenameComplete,
    experiment_url: window.location.href,
    screen_width: window.screen.width,
    screen_height: window.screen.height,
    window_width: window.innerWidth,
    window_height: window.innerHeight,
    browser_language: navigator.language,
    user_agent: navigator.userAgent
  });

  /*
    =========================================================
    CUSTOM PLUGIN: DOMINANCE VIDEO
    =========================================================
  */

  const jsPsychDominanceVideo = (function() {

    const info = {
      name: "dominance-video",
      version: "1.4.0",
      parameters: {
        stimulus: {
          type: "VIDEO",
          default: undefined
        },
        video_part: {
          type: "STRING",
          default: null
        },
        initial_value: {
          type: "INT",
          default: 0
        },
        step: {
          type: "INT",
          default: 20
        },
        min_value: {
          type: "INT",
          default: -100
        },
        max_value: {
          type: "INT",
          default: 100
        },
        repeat_interval_ms: {
          type: "INT",
          default: 250
        }
      },
      data: {
        stimulus: { type: "STRING" },
        final_dominance: { type: "INT" },
        dominance_events_json: { type: "STRING" },
        media_events_json: { type: "STRING" },
        video_duration: { type: "FLOAT" },
        n_dominance_changes: { type: "INT" },
        trial_end_reason: { type: "STRING" },
        interrupted: { type: "BOOL" },
        interruption_source: { type: "STRING" },
        repeat_interval_ms: { type: "INT" }
      }
    };

    class DominanceVideoPlugin {
      constructor(jsPsych) {
        this.jsPsych = jsPsych;
      }

      trial(display_element, trial) {
        let dominance = trial.initial_value;
        let dominanceEvents = [];
        let mediaEvents = [];

        let trialStartTime = performance.now();
        let videoStartWallTime = null;
        let lastChangeWallTime = null;
        let videoStarted = false;
        let trialEnded = false;

        let heldKey = null;
        let holdInterval = null;

        const repeatIntervalMs = trial.repeat_interval_ms;

        display_element.innerHTML = `
          <div id="dominance-task">
            <div id="video-panel">
              <video id="stim-video" preload="auto" playsinline>
                <source src="${trial.stimulus}" type="video/mp4">
                Your browser does not support the video tag.
              </video>

              <button id="play-button">PLAY</button>
            </div>

            <div id="scale-panel">
              <div id="scale-title">Dominance</div>

              <div id="scale-container">
                <div id="scale-axis"></div>

                <div id="positive-fill"></div>
                <div id="negative-fill"></div>

                <div id="zero-tick"></div>
                <div id="tick-plus" class="major-tick"></div>
                <div id="tick-minus" class="major-tick"></div>

                <div id="label-plus" class="scale-label">+100<br>In controllo</div>
                <div id="label-zero" class="scale-label">0</div>
                <div id="label-minus" class="scale-label">-100<br>Sopraffatto</div>

                <div id="dominance-handle"></div>
              </div>

              <div id="current-value">0</div>

              <div id="instructions">
                Freccia su: più in controllo<br>
                Freccia giù: meno in controllo<br><br>
                Tieni premute le frecce per muovere il cursore di continuo.<br>
                ESC: interrompe l'esperimento.
              </div>
            </div>
          </div>
        `;

        const video = display_element.querySelector("#stim-video");
        const playButton = display_element.querySelector("#play-button");
        const handle = display_element.querySelector("#dominance-handle");
        const positiveFill = display_element.querySelector("#positive-fill");
        const negativeFill = display_element.querySelector("#negative-fill");
        const currentValue = display_element.querySelector("#current-value");

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function valueToPercentFromTop(value) {
          return ((trial.max_value - value) / (trial.max_value - trial.min_value)) * 100;
        }

        function updateScale() {
          const percent = valueToPercentFromTop(dominance);

          handle.style.top = `calc(${percent}% - 15px)`;
          currentValue.textContent = dominance > 0 ? `+${dominance}` : `${dominance}`;

          if (dominance > 0) {
            positiveFill.style.bottom = "50%";
            positiveFill.style.height = `${50 - percent}%`;
            negativeFill.style.height = "0%";
            handle.style.background = "#3fa7ff";
          } else if (dominance < 0) {
            positiveFill.style.height = "0%";
            negativeFill.style.top = "50%";
            negativeFill.style.height = `${percent - 50}%`;
            handle.style.background = "#ff8c42";
          } else {
            positiveFill.style.height = "0%";
            negativeFill.style.height = "0%";
            handle.style.background = "white";
          }
        }

        function nowFromTrialStart() {
          return performance.now() - trialStartTime;
        }

        function nowFromVideoStart() {
          if (videoStartWallTime === null) {
            return null;
          }

          return performance.now() - videoStartWallTime;
        }

        function logMediaEvent(eventType) {
          mediaEvents.push({
            event_type: eventType,
            video_time_sec: Number(video.currentTime.toFixed(4)),
            time_since_trial_start_ms: Math.round(nowFromTrialStart()),
            time_since_video_start_ms: nowFromVideoStart() === null ? null : Math.round(nowFromVideoStart())
          });
        }

        function logDominanceChange(key, oldValue, newValue) {
          const now = performance.now();

          dominanceEvents.push({
            event_type: "dominance_change",
            key: key,
            old_value: oldValue,
            value: newValue,
            video_time_sec: Number(video.currentTime.toFixed(4)),
            time_since_trial_start_ms: Math.round(now - trialStartTime),
            time_since_video_start_ms: videoStartWallTime === null ? null : Math.round(now - videoStartWallTime),
            time_since_last_change_ms: lastChangeWallTime === null ? null : Math.round(now - lastChangeWallTime)
          });

          lastChangeWallTime = now;
        }

        function canRespond() {
          return videoStarted && !video.paused && !video.ended && !trialEnded;
        }

        function applyDominanceStep(key) {
          if (!canRespond()) {
            return;
          }

          const oldValue = dominance;

          if (key === "ArrowUp") {
            dominance = clamp(dominance + trial.step, trial.min_value, trial.max_value);
          }

          if (key === "ArrowDown") {
            dominance = clamp(dominance - trial.step, trial.min_value, trial.max_value);
          }

          if (dominance !== oldValue) {
            updateScale();
            logDominanceChange(key, oldValue, dominance);
          }
        }

        function stopHeldKey() {
          heldKey = null;

          if (holdInterval !== null) {
            clearInterval(holdInterval);
            holdInterval = null;
          }
        }

        function startHeldKey(key) {
          if (!canRespond()) {
            return;
          }

          if (heldKey === key && holdInterval !== null) {
            return;
          }

          stopHeldKey();
          heldKey = key;

          applyDominanceStep(key);

          holdInterval = setInterval(() => {
            applyDominanceStep(key);
          }, repeatIntervalMs);
        }

        function buildTrialData(reason, interrupted, interruptionSource) {
          return {
            task: "dominance_video_rating",
            video_part: trial.video_part,
            stimulus: trial.stimulus,
            video_file: trial.stimulus,
            final_dominance: dominance,
            dominance_events_json: JSON.stringify(dominanceEvents),
            media_events_json: JSON.stringify(mediaEvents),
            video_duration: Number.isFinite(video.duration) ? video.duration : null,
            n_dominance_changes: dominanceEvents.filter(e => e.event_type === "dominance_change").length,
            trial_end_reason: reason,
            interrupted: interrupted,
            interruption_source: interruptionSource,
            repeat_interval_ms: repeatIntervalMs
          };
        }

        function cleanup() {
          stopHeldKey();

          document.body.classList.remove("hide-cursor");

          window.removeEventListener("keydown", onKeyDown, true);
          window.removeEventListener("keyup", onKeyUp, true);
          document.removeEventListener("fullscreenchange", onFullscreenChange);
        }

        function endTrial(reason = "video_ended", interrupted = false, interruptionSource = null) {
          if (trialEnded) {
            return;
          }

          trialEnded = true;

          cleanup();

          const trialData = buildTrialData(reason, interrupted, interruptionSource);

          display_element.innerHTML = "";

          this.jsPsych.finishTrial(trialData);
        }

        endTrial = endTrial.bind(this);

        function interruptTrial(source = "escape_key") {
          if (trialEnded) {
            return;
          }

          experimentInterrupted = true;

          try {
            video.pause();
          } catch (err) {}

          const now = performance.now();

          dominanceEvents.push({
            event_type: "experiment_interrupted",
            source: source,
            value: dominance,
            video_time_sec: Number(video.currentTime.toFixed(4)),
            time_since_trial_start_ms: Math.round(now - trialStartTime),
            time_since_video_start_ms: videoStartWallTime === null ? null : Math.round(now - videoStartWallTime),
            time_since_last_change_ms: lastChangeWallTime === null ? null : Math.round(now - lastChangeWallTime)
          });

          endTrial("interrupted", true, source);
        }

        function onKeyDown(e) {
          if (trialEnded) {
            return;
          }

          if (e.key === "Escape") {
            e.preventDefault();
            interruptTrial("escape_key");
            return;
          }

          if (e.key !== "ArrowUp" && e.key !== "ArrowDown") {
            return;
          }

          e.preventDefault();

          startHeldKey(e.key);
        }

        function onKeyUp(e) {
          if (e.key === heldKey) {
            stopHeldKey();
          }
        }

        function onFullscreenChange() {
          if (!trialEnded && videoStarted && !document.fullscreenElement) {
            interruptTrial("fullscreen_exit");
          }
        }

        updateScale();

        window.addEventListener("keydown", onKeyDown, true);
        window.addEventListener("keyup", onKeyUp, true);
        document.addEventListener("fullscreenchange", onFullscreenChange);

        video.addEventListener("waiting", () => {
          logMediaEvent("video_waiting");
        });

        video.addEventListener("stalled", () => {
          logMediaEvent("video_stalled");
        });

        video.addEventListener("playing", () => {
          logMediaEvent("video_playing");
        });

        video.addEventListener("pause", () => {
          if (!video.ended && !trialEnded) {
            logMediaEvent("video_pause");
          }
        });

        video.addEventListener("ended", () => {
          logMediaEvent("video_ended");
          endTrial("video_ended", false, null);
        });

        playButton.addEventListener("click", async () => {
          playButton.disabled = true;

          try {
            await video.play();

            videoStarted = true;
            videoStartWallTime = performance.now();
            lastChangeWallTime = videoStartWallTime;

            playButton.style.display = "none";
            document.body.classList.add("hide-cursor");

            dominanceEvents.push({
              event_type: "video_start",
              value: dominance,
              video_time_sec: Number(video.currentTime.toFixed(4)),
              time_since_trial_start_ms: Math.round(videoStartWallTime - trialStartTime),
              time_since_video_start_ms: 0,
              time_since_last_change_ms: null
            });

          } catch (err) {
            playButton.disabled = false;
            playButton.textContent = "CLICK TO PLAY";
            document.body.classList.remove("hide-cursor");
            console.error("Video playback failed:", err);
          }
        });
      }
    }

    DominanceVideoPlugin.info = info;

    return DominanceVideoPlugin;
  })();

  /*
    =========================================================
    TIMELINE
    =========================================================
  */

  const preload = {
    type: jsPsychPreload,
    video: [VIDEO_PART1_FILE, VIDEO_PART2_FILE],
    images: INSTRUCTION_IMAGES,
    show_progress_bar: true,
    message: "Caricamento dell'esperimento...",
    show_detailed_errors: true,
    continue_after_error: true,
    on_error: function(file) {
      console.error("Preload error for:", file);
    }
  };

  const enter_fullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: `
      <div class="message-box">
        <p>L'esperimento verrà avviato in modalità a schermo intero.</p>
        <p>Per favore, mantieni il browser in modalità a schermo intero fino alla fine del task.</p>
      </div>
    `,
    button_label: "Inizia"
  };

  const instruction_pages = INSTRUCTION_IMAGES.map(function(imagePath, index) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="fullscreen-instruction-page">
          <img
            class="fullscreen-instruction-image"
            src="${imagePath}"
            alt="Istruzioni pagina ${index + 1}"
          >
        </div>
      `,
      choices: ["Continua"],
      data: {
        task: "instruction_page",
        instruction_page_number: index + 1,
        instruction_image: imagePath
      },
      on_load: function() {
        document.body.classList.add("instruction-screen");
      },
      on_finish: function(data) {
        data.instruction_rt_ms = data.rt;
        document.body.classList.remove("instruction-screen");
      }
    };
  });

  const researcher_code_page = {
    type: jsPsychSurveyText,
    preamble: `
      <div class="message-box">
        <p>Inserisca qui sotto il codice che le è stato fornito dai ricercatori</p>
      </div>
    `,
    questions: [
      {
        prompt: "",
        name: "researcher_code",
        required: true,
        rows: 1,
        columns: 40,
        placeholder: "Codice"
      }
    ],
    button_label: "Continua",
    data: {
      task: "researcher_code_entry"
    },
    on_load: function() {
      document.body.classList.add("code-screen");
    },
    on_finish: function(data) {
      document.body.classList.remove("code-screen");

      let response = data.response;

      if (typeof response === "string") {
        try {
          response = JSON.parse(response);
        } catch (err) {
          response = {};
        }
      }

      const code = response && response.researcher_code !== undefined
        ? String(response.researcher_code).trim()
        : "";

      data.researcher_code = code;

      jsPsych.data.addProperties({
        researcher_code: code
      });
    }
  };

  const dominance_trial_part1 = {
    type: jsPsychDominanceVideo,
    stimulus: VIDEO_PART1_FILE,
    video_part: "part1",
    initial_value: 0,
    step: 20,
    min_value: -100,
    max_value: 100,
    repeat_interval_ms: 125
  };

  const save_data_part1 = {
    type: jsPsychPipe,
    action: "save",
    experiment_id: EXPERIMENT_ID,
    filename: dataFilenamePart1,
    data_string: function() {
      return jsPsych.data.get().csv();
    },
    wait_message: `
      <div class="message-box">
        <p>Salvataggio dei dati della prima parte in corso.</p>
        <p>Per favore, non chiudere questa pagina.</p>
      </div>
    `,
    compression: true
  };

  const between_parts_page = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="message-box">
        <p>Ha completato la prima parte della visione del film!</p>
        <p>
          Quando si sentirà pronto proceda alla visione della seconda e ultima parte.
          Clicchi <strong>Continua</strong> per procedere.
        </p>
      </div>
    `,
    choices: ["Continua"],
    data: {
      task: "between_parts_page"
    }
  };

  const dominance_trial_part2 = {
    type: jsPsychDominanceVideo,
    stimulus: VIDEO_PART2_FILE,
    video_part: "part2",
    initial_value: 0,
    step: 20,
    min_value: -100,
    max_value: 100,
    repeat_interval_ms: 125
  };

  const save_data_complete = {
    type: jsPsychPipe,
    action: "save",
    experiment_id: EXPERIMENT_ID,
    filename: dataFilenameComplete,
    data_string: function() {
      return jsPsych.data.get().csv();
    },
    wait_message: `
      <div class="message-box">
        <p>Salvataggio dei dati finali in corso.</p>
        <p>Per favore, non chiudere questa pagina.</p>
      </div>
    `,
    compression: true
  };

  const part2_block = {
    timeline: [
      between_parts_page,
      dominance_trial_part2,
      save_data_complete
    ],
    conditional_function: function() {
      /*
        If the participant interrupts the experiment during part 1,
        part 2 is skipped. The part 1 data have already been saved.
      */
      return !experimentInterrupted;
    }
  };

  const exit_fullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: false,
    delay_after: 0
  };

  const final_message = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      const pipeTrial = jsPsych.data
        .get()
        .filter({ trial_type: "pipe" })
        .last(1)
        .values()[0];

      if (pipeTrial && pipeTrial.success === true) {
        return `
          <div class="message-box">
            <h2>Grazie!</h2>
            <p>Il task è terminato e i dati sono stati salvati correttamente.</p>
            <p>Puoi chiudere questa finestra.</p>
          </div>
        `;
      } else {
        return `
          <div class="message-box">
            <h2>Attenzione</h2>
            <p>Il task è terminato, ma potrebbe esserci stato un problema nel salvataggio dei dati.</p>
            <p>Ci dispiace.</p>
          </div>
        `;
      }
    },
    choices: ["Fine"]
  };

  jsPsych.run([
    preload,
    enter_fullscreen,
    ...instruction_pages,
    researcher_code_page,
    dominance_trial_part1,
    save_data_part1,
    part2_block,
    exit_fullscreen,
    final_message
  ]);
</script>
</html>
